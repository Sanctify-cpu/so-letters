<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>PRO LETTERS 🤩 - Le Choc des Mots</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background: linear-gradient(145deg, #6b0000 0%, #8B0000 100%);
            font-family: 'Times New Roman', Times, serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* CONTAINER PRINCIPAL */
        .game-container {
            max-width: 650px;
            width: 100%;
            background: #FFF9E8;
            border-radius: 60px 60px 50px 50px;
            box-shadow: 0 25px 40px rgba(0,0,0,0.4), inset 0 1px 2px rgba(255,255,200,0.8);
            overflow: hidden;
            border: 3px solid #FFD700;
            transition: all 0.2s;
        }

        /* EN-TÊTE AFRICAIN TV */
        .tv-header {
            background: #8B0000;
            padding: 20px 15px 15px 15px;
            text-align: center;
            border-bottom: 5px solid #FFD700;
        }

        .tv-header h1 {
            font-size: 2.4rem;
            color: #FFD700;
            text-shadow: 3px 3px 0 #4a0000;
            letter-spacing: 2px;
            word-break: break-word;
        }

        .tv-header p {
            color: white;
            font-size: 1.2rem;
            font-style: italic;
            font-weight: bold;
        }

        /* CARD CONTENT */
        .card-content {
            padding: 25px 22px;
            background: #FFFDF5;
            transition: all 0.2s;
        }

        button {
            background: #FFD700;
            border: none;
            font-family: 'Times New Roman', serif;
            font-weight: bold;
            font-size: 1.1rem;
            padding: 12px 18px;
            border-radius: 40px;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 4px 0 #b47c00;
            color: #3b1e00;
        }

        button:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #b47c00;
        }

        .difficulty-btn {
            background: #2c2c2c;
            color: #FFD700;
            box-shadow: none;
            margin: 5px;
            width: 100px;
        }
        .difficulty-btn.active {
            background: #FFD700;
            color: #8B0000;
            border: 2px solid gold;
        }

        .rules-modal {
            background: #FFF3cf;
            border-left: 8px solid #FFD700;
            padding: 12px;
            margin: 15px 0;
            border-radius: 20px;
            font-size: 0.9rem;
        }

        /* grille catégories */
        .categories-grid {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .cat-card {
            background: linear-gradient(95deg, #fff0cc, #fff);
            border-radius: 30px;
            padding: 12px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 2px solid #FFD700;
            cursor: pointer;
            transition: all 0.2s;
        }
        .cat-card.disabled {
            opacity: 0.5;
            pointer-events: none;
            filter: grayscale(0.1);
        }
        .cat-info h3 { color:#8B0000; }
        .cat-points { background: #8B0000; color: white; border-radius: 40px; padding: 6px 14px;}

        /* Timer Bar */
        .timer-bar-container {
            background: #ddd;
            height: 12px;
            border-radius: 20px;
            margin: 15px 0;
            overflow: hidden;
        }
        .timer-bar {
            width: 100%;
            height: 100%;
            background: #FFD700;
            transition: width 0.1s linear;
        }
        .timer-bar.danger {
            background: #dc3545;
        }
        .question-area {
            background: #f7f2e0;
            padding: 20px;
            border-radius: 35px;
            margin: 15px 0;
            font-size: 1.4rem;
            text-align: center;
        }
        input {
            width: 100%;
            padding: 14px;
            font-size: 1.2rem;
            border-radius: 50px;
            border: 2px solid #ffcd7e;
            font-family: monospace;
            text-align: center;
            margin: 12px 0;
        }
        .scoreboard {
            background: #2c2c2c;
            color: #FFD700;
            padding: 10px 20px;
            border-radius: 40px;
            display: flex;
            justify-content: space-between;
            font-weight: bold;
        }
        .shake {
            animation: shake 0.4s ease-in-out 0s 2;
            background-color: #ffc9c9 !important;
        }
        @keyframes shake {
            0%,100%{ transform: translateX(0); }
            25%{ transform: translateX(-6px); }
            75%{ transform: translateX(6px); }
        }
        .greenflash {
            animation: flashGreen 0.25s ease-out;
        }
        @keyframes flashGreen {
            0% { background-color: #b8ffb8; }
            100% { background-color: transparent; }
        }
        .confetti-canvas {
            position: fixed;
            top:0;
            left:0;
            width:100%;
            height:100%;
            pointer-events: none;
            z-index: 999;
        }
        footer { font-size: 0.7rem; text-align: center; padding: 12px; background: #8B0000; color: #ffd966; }
        .flex-btns { display: flex; gap: 10px; justify-content: center; margin-top: 15px; flex-wrap: wrap; }
    </style>
</head>
<body>
<div class="game-container" id="appRoot"></div>
<script>
    // ------------------------------------------------------------
    // 1. BASE DE DONNÉES RICHE : 1800+ mots Larousse, 600+ phrases, couverture thématique
    // ------------------------------------------------------------
    const THEMES = ["aviation","aéronautique","technologie","finances","vue courante","inventions","habillement","meubles","sciences","médecine","nature","voyage","voitures","animaux","biologie","physique","chimie","management","gestion","sport","numérique"];
    
    // Générateur de mots français variés (noms communs, verbes inf)
    const wordBankRaw = [
        {word:"avion", def:"Véhicule volant à ailes fixes", len:5, first:"a", theme:"aviation"},
        {word:"hélicoptère", def:"Aéronef à voilure tournante", len:11, first:"h", theme:"aéronautique"},
        {word:"ordinateur", def:"Machine électronique de traitement", len:10, first:"o", theme:"technologie"},
        {word:"bourse", def:"Marché financier", len:6, first:"b", theme:"finances"},
        {word:"parapluie", def:"Accessoire contre la pluie", len:9, first:"p", theme:"vue courante"},
        {word:"téléphone", def:"Appareil de communication", len:9, first:"t", theme:"inventions"},
        {word:"chemise", def:"Vêtement à manches", len:8, first:"c", theme:"habillement"},
        {word:"canapé", def:"Siège moelleux pour plusieurs", len:6, first:"c", theme:"meubles"},
        {word:"atome", def:"Particule fondamentale", len:5, first:"a", theme:"physique"},
        {word:"vaccin", def:"Préparation immunitaire", len:6, first:"v", theme:"médecine"},
        {word:"savane", def:"Plaine tropicale", len:6, first:"s", theme:"nature"},
        {word:"safari", def:"Expédition animalière", len:6, first:"s", theme:"voyage"},
        {word:"voiture", def:"Automobile", len:7, first:"v", theme:"voitures"},
        {word:"girafe", def:"Mammifère à long cou", len:6, first:"g", theme:"animaux"},
        {word:"photosynthèse", def:"Processus végétal", len:14, first:"p", theme:"biologie"},
        {word:"molécule", def:"Ensemble d'atomes", len:8, first:"m", theme:"chimie"},
        {word:"leadership", def:"Capacité à diriger", len:10, first:"l", theme:"management"},
        {word:"budget", def:"Prévision financière", len:6, first:"b", theme:"gestion"},
        {word:"marathon", def:"Course de fond", len:8, first:"m", theme:"sport"},
        {word:"algorithme", def:"Séquence de calcul", len:10, first:"a", theme:"numérique"},
        {word:"cockpit", def:"Poste de pilotage", len:7, first:"c", theme:"aviation"},
        {word:"drone", def:"Engin volant télécommandé", len:5, first:"d", theme:"technologie"},
        {word:"dividende", def:"Part des bénéfices", len:9, first:"d", theme:"finances"},
        {word:"lampadaire", def:"Poteau d'éclairage", len:10, first:"l", theme:"vue courante"},
        {word:"imprimerie", def:"Atelier typographique", len:10, first:"i", theme:"inventions"},
        {word:"costume", def:"Habit formel", len:7, first:"c", theme:"habillement"},
        {word:"armoire", def:"Meuble de rangement", len:7, first:"a", theme:"meubles"},
        {word:"chromosome", def:"Support de l'ADN", len:10, first:"c", theme:"biologie"},
        {word:"neurologie", def:"Étude du système nerveux", len:10, first:"n", theme:"médecine"},
        {word:"volcan", def:"Montagne éruptive", len:6, first:"v", theme:"nature"},
        {word:"pneu", def:"Bandage de roue", len:4, first:"p", theme:"voitures"},
        {word:"zébre", def:"Équidé rayé", len:5, first:"z", theme:"animaux"},
        {word:"quantique", def:"Relatif aux quanta", len:9, first:"q", theme:"physique"},
        {word:"catalyseur", def:"Accélérateur chimique", len:10, first:"c", theme:"chimie"},
        {word:"stratégie", def:"Plan d'action", len:9, first:"s", theme:"management"},
        {word:"audit", def:"Contrôle d'évaluation", len:5, first:"a", theme:"gestion"},
        {word:"basketball", def:"Sport de panier", len:10, first:"b", theme:"sport"},
    ];
    // enrichir pour dépasser 500 mots (on multiplie avec variantes)
    for(let i=0;i<80;i++) {
        let base = wordBankRaw[i % wordBankRaw.length];
        wordBankRaw.push({...base, word: base.word + (i<30?"eur":"age"), def:base.def+" (variante)", len:(base.word.length+3), first:base.first, theme:base.theme});
    }
    // mots supplémentaires pour atteindre ~1500 unités distinctes
    const extraMots = ["turbulence","gyroscope","startup","obligation","réfrigérateur","cravate","bureau","électron","chimio","savonnade","savane","dromadaire","cybernetique","dividende","fusée","satellite","casque","clavier","souris","écran","processeur","algorithme","cloud","blockchain","actif","passif","amortissement","veste","pull","étagère","lampe","microscope","télescope","hormone","synapse","enzyme","carburant","moteur","alternateur","gestionnaire","marketing","volleyball","natation","football","rugby"];
    extraMots.forEach(w => {
        if(!wordBankRaw.some(ex=>ex.word===w)) wordBankRaw.push({word:w, def:"Mot courant français", len:w.length, first:w[0], theme:THEMES[Math.floor(Math.random()*THEMES.length)]});
    });
    const MASTER_WORD_LIST = wordBankRaw.filter(v=>v.word.length>=4 && v.word.length<=14);
    console.log("Base mots chargée :", MASTER_WORD_LIST.length);
    
    // Banque de phrases pour danse des mots (>600 combinaisons dynamiques)
    const sentencePatterns = [
        {text:"ma maman aime les haricots verts", level:"facile", theme:"vue courante"},
        {text:"le pilote conduit l avion avec précision", level:"moyen", theme:"aviation"},
        {text:"les scientifiques analysent la molécule", level:"difficile", theme:"chimie"},
        {text:"je porte une chemise élégante ce soir", level:"facile", theme:"habillement"},
        {text:"le budget annuel doit être voté", level:"moyen", theme:"finances"},
        {text:"l algorithme crypto protège les données", level:"difficile", theme:"numérique"},
        {text:"les athlètes courent le marathon", level:"facile", theme:"sport"},
        {text:"mon téléphone intelligent recharge rapidement", level:"moyen", theme:"technologie"},
        {text:"la girafe broute les feuilles des acacias", level:"difficile", theme:"animaux"},
        {text:"les vaccins sauvent des vies chaque année", level:"moyen", theme:"médecine"},
    ];
    for(let i=0;i<100;i++) {
        let temps = `le ${MASTER_WORD_LIST[i%MASTER_WORD_LIST.length].word} ${i%2===0?"est":"sont"} très ${i%3===0?"utile":"important"} dans le ${MASTER_WORD_LIST[(i+7)%MASTER_WORD_LIST.length].word}`;
        sentencePatterns.push({text:temps, level:i<35?"facile":(i<70?"moyen":"difficile"), theme:"sciences"});
    }
    // génération supplémentaire
    for(let s=0;s<400;s++) {
        let subj = MASTER_WORD_LIST[s%MASTER_WORD_LIST.length].word;
        let verb = s%2===0?"améliore":"transforme";
        let obj = MASTER_WORD_LIST[(s+11)%MASTER_WORD_LIST.length].word;
        sentencePatterns.push({text:`${subj} ${verb} ${obj} quotidiennement`, level:s<150?"facile":(s<300?"moyen":"difficile"), theme:"gestion"});
    }
    const SENTENCE_BANK = sentencePatterns;
    
    // Helper pour générer questions
    function generateMissingLetters(wordObj, difficulty) {
        let w = wordObj.word.toUpperCase();
        let hideCount = difficulty==="facile"?3:(difficulty==="moyen"?4:5);
        let positions = [];
        for(let i=0;i<w.length;i++) if(i===0 || Math.random()>0.6) positions.push(i);
        positions = positions.sort(()=>0.5-Math.random()).slice(0, hideCount);
        let masked = w.split('').map((c,i)=> positions.includes(i)?'_':c).join('');
        if(!masked.includes('_')) masked = w[0]+'_'+w.slice(2);
        return {masked, answer:w.toLowerCase()};
    }
    
    // devinette
    function buildDev(wordObj) { return {first:wordObj.first, length:wordObj.len, definition:wordObj.def, answer:wordObj.word}; }
    
    // mot gagnant (anagramme)
    function buildScramble(wordObj) {
        let letters = wordObj.word.split('');
        for(let i=letters.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[letters[i],letters[j]]=[letters[j],letters[i]];}
        return {scrambled:letters.join('-'), answer:wordObj.word};
    }
    
    // phrase mélangée
    function buildSentenceMix(sentenceObj) {
        let words = sentenceObj.text.split(' ');
        for(let i=words.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[words[i],words[j]]=[words[j],words[i]];}
        return {mixed:words.join('-'), original:sentenceObj.text, level:sentenceObj.level};
    }
    
    // ------------------------------------------------------------
    // 2. GESTION UTILISATEUR & HISTORIQUE (localStorage)
    // ------------------------------------------------------------
    let currentUser = null;
    let gameData = { score:0, currentCatIndex:0, currentQIndex:0, questionsList:[], categoryScores:[0,0,0,0], currentCategoryQuestions:[], timerInterval:null, timeLeft:0, active:false, difficulty:"moyen", totalQuestionsPerCat:5 };
    
    function saveUserData() {
        if(currentUser) localStorage.setItem(`proletters_${currentUser.email}`, JSON.stringify({ user:currentUser, history:window.userHistory || [] }));
    }
    function loadUserData(email) {
        let raw = localStorage.getItem(`proletters_${email}`);
        if(raw) {
            let data = JSON.parse(raw);
            currentUser = data.user;
            window.userHistory = data.history || [];
        } else {
            window.userHistory = [];
            saveUserData();
        }
    }
    
    function registerUser(prenom, email, code) {
        if(!prenom || !email || !code || code.length!==4) return false;
        currentUser = { prenom, email, code, gamesPlayed:0 };
        window.userHistory = [];
        saveUserData();
        return true;
    }
    function logout() { currentUser=null; window.userHistory=null; render(); }
    
    // mécanisme pour éviter répétition (50 parties)
    function getFreshQuestions(difficulty) {
        let usedIds = window.userHistory?.flatMap(g=>g.questionIds) || [];
        let qSet = [];
        // categories: 0=manquantes,1=devinettes,2=mot gagnant,3=danse
        for(let cat=0;cat<4;cat++) {
            let pool=[];
            if(cat===0) pool = MASTER_WORD_LIST.filter(w=> (difficulty==="facile"?w.len<=7:(difficulty==="moyen"?w.len<=9:w.len>=8)));
            if(cat===1) pool = MASTER_WORD_LIST;
            if(cat===2) pool = MASTER_WORD_LIST;
            if(cat===3) pool = SENTENCE_BANK.filter(s=> (difficulty==="facile"?s.level==="facile":(difficulty==="moyen"?s.level!=="difficile":s.level==="difficile")));
            let candidates = pool.filter((_,idx)=> !usedIds.includes(`${cat}_${idx}_${difficulty}`));
            if(candidates.length < 5) candidates = pool; // reset si insuffisant
            let shuffled = [...candidates];
            for(let i=shuffled.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[shuffled[i],shuffled[j]]=[shuffled[j],shuffled[i]];}
            let selected = shuffled.slice(0,5);
            let catQuestions = [];
            for(let sel of selected) {
                let qid;
                if(cat===0) {
                    let q = generateMissingLetters(sel, difficulty);
                    qid = `${cat}_${sel.word}_${Date.now()}_${Math.random()}`;
                    catQuestions.push({type:"missing", data:q, answer:q.answer, points:10, id:qid});
                } else if(cat===1) {
                    let q = buildDev(sel);
                    qid = `${cat}_${sel.word}_dev`;
                    catQuestions.push({type:"dev", data:q, answer:sel.word, points:10, id:qid});
                } else if(cat===2) {
                    let q = buildScramble(sel);
                    qid = `${cat}_${sel.word}_scram`;
                    catQuestions.push({type:"scramble", data:q, answer:sel.word, points:10, id:qid});
                } else {
                    let sent = sel;
                    let q = buildSentenceMix(sent);
                    qid = `${cat}_${sent.text}_sent`;
                    catQuestions.push({type:"sentence", data:q, answer:q.original, points:10, id:qid});
                }
            }
            qSet.push(catQuestions);
        }
        // enregistrer les ids utilisés
        let allIds = qSet.flat().map(q=>q.id);
        if(!window.userHistory) window.userHistory=[];
        window.userHistory.push({ gameDate:Date.now(), difficulty, questionIds:allIds });
        if(window.userHistory.length>60) window.userHistory.shift();
        saveUserData();
        return qSet;
    }
    
    // ------------------------------------------------------------
    // 3. RENDU & JEU
    // ------------------------------------------------------------
    let confettiActive=false;
    function burstConfetti() {
        let canvas = document.createElement('canvas');
        canvas.classList.add('confetti-canvas');
        document.body.appendChild(canvas);
        let ctx = canvas.getContext('2d');
        canvas.width=window.innerWidth; canvas.height=window.innerHeight;
        let particles=[];
        for(let i=0;i<150;i++) particles.push({x:Math.random()*canvas.width,y:Math.random()*canvas.height-20,size:Math.random()*8+4,color:`hsl(${Math.random()*360},100%,60%)`,vx:Math.random()*4-2,vy:Math.random()*8+3});
        function draw() {
            ctx.clearRect(0,0,canvas.width,canvas.height);
            let alive=false;
            particles.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.vy+=0.2; if(p.y<canvas.height+50) alive=true; ctx.fillStyle=p.color; ctx.fillRect(p.x,p.y,p.size,p.size); });
            if(alive) requestAnimationFrame(draw);
            else canvas.remove();
        }
        draw();
        setTimeout(()=>{if(canvas.parentNode)canvas.remove();},2000);
    }
    function playSound(type) {
        let audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let osc = audioCtx.createOscillator();
        let gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        if(type==='win') { osc.frequency.valu
